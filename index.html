<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatLampo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="chat-container">
    <div class="header">
      <h1>☕ ChatLampo</h1>
      <p class="subtitle">La tua pausa, la tua chat temporanea.</p>
    </div>

    <!-- SCHERMATA INIZIALE -->
    <div id="intro-screen">
      <!-- Chat Pubblica -->
      <button id="btn-public" class="btn primary" style="background-color: #2e7d32;">🌐 Entra nella Chat Pubblica</button>
      
      <div class="divider">oppure chat privata</div>

      <!-- Chat Privata -->
      <button id="btn-create" class="btn secondary">Crea Stanza Privata</button>
      <input type="text" id="room-code-input" placeholder="Inserisci codice stanza..." style="text-transform: uppercase;">
      <button id="btn-join" class="btn secondary">Entra in Privata</button>
    </div>

    <!-- SCHERMATA CHAT -->
    <div id="chat-screen" style="display: none;">
      <div class="room-info">
        <span>Stanza: <strong id="room-code-display">---</strong></span>
        <button id="btn-leave" class="btn-danger">Esci</button>
      </div>

      <div id="messages" class="messages-box"></div>

      <!-- BARRA IN BASSO (FOTOCAMERA, GALLERIA, TESTO, INVIA) -->
      <div class="input-box">
        <!-- Tasto Fotocamera -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
        <button id="btn-camera" class="btn-icon" title="Scatta Foto">📷</button>

        <!-- Tasto Galleria -->
        <input type="file" id="gallery-input" accept="image/*" style="display: none;">
        <button id="btn-gallery" class="btn-icon" title="Scegli da Galleria">🖼️</button>
        
        <!-- Input Messaggio -->
        <input type="text" id="message-input" placeholder="Scrivi un messaggio...">
        <button id="btn-send" class="btn primary">Invia</button>
      </div>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
