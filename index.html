<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatLampo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="chat-container">
    <div class="header">
      <h1>☕ ChatLampo</h1>
      <p class="subtitle">La tua pausa, la tua chat temporanea.</p>
    </div>

    <!-- Schermata di benvenuto -->
    <div id="intro-screen">
      <button id="btn-create" class="btn primary">Crea Nuova Stanza</button>
      <div class="divider">oppure</div>
      <input type="text" id="room-code-input" placeholder="Inserisci codice stanza..." style="text-transform: uppercase;">
      <button id="btn-join" class="btn secondary">Entra</button>
    </div>

    <!-- Schermata Chat -->
    <div id="chat-screen" style="display: none;">
      <div class="room-info">
        <span>Stanza: <strong id="room-code-display">---</strong></span>
        <button id="btn-leave" class="btn-danger">Esci</button>
      </div>

      <div id="messages" class="messages-box"></div>

      <div class="input-box">
        <!-- Input file nascosto: apre fotocamera/galleria -->
        <input type="file" id="image-input" accept="image/*" style="display: none;">
        <button id="btn-attach" class="btn-icon">📷</button>
        
        <input type="text" id="message-input" placeholder="Scrivi un messaggio...">
        <button id="btn-send" class="btn primary">Invia</button>
      </div>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
